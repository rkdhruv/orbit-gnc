name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]   # macos-latest is Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Only the downloaded archives are cached; FetchContent skips the download
      # when the archive is already present with a matching SHA256.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps/*-subbuild/*-populate-prefix/src
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset release -DORBIT_WERROR=ON
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  asan:
    name: ubuntu asan + ubsan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/asan/_deps/*-subbuild/*-populate-prefix/src
          key: deps-asan-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset asan -DORBIT_WERROR=ON
      - name: Build
        run: cmake --build --preset asan
      - name: Test
        run: ctest --preset asan
